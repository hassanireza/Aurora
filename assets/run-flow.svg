<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">Aurora execution flow</title><desc id="d">Eight steps from opening a level to saving progress: show the scene, call checkCss, load hidden frames, render your CSS, render the answer key, compare computed styles, show the verdict and record progress. Lint notes, held states and the 6 second load limit have their own paths.</desc><defs><style>.s{font-family:'Playfair Display',Georgia,'Times New Roman',serif}.si{font-family:'Playfair Display',Georgia,'Times New Roman',serif;font-style:italic}.m{font-family:'DM Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace}.b{font-family:'DM Sans','Segoe UI',Helvetica,Arial,sans-serif}</style><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5L8.5 5L1 8.5" fill="none" stroke="#ffbd78" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker><radialGradient id="bgtop" cx="50%" cy="-10%" r="85%"><stop offset="0" stop-color="#2e1b30"/><stop offset="0.6" stop-color="#2e1b30" stop-opacity="0"/></radialGradient><radialGradient id="bgcorner" cx="100%" cy="100%" r="70%"><stop offset="0" stop-color="#27172b"/><stop offset="1" stop-color="#27172b" stop-opacity="0"/></radialGradient><radialGradient id="halo"><stop offset="0" stop-color="#ffbd78" stop-opacity=".55"/><stop offset=".5" stop-color="#c9703c" stop-opacity=".16"/><stop offset="1" stop-color="#c9703c" stop-opacity="0"/></radialGradient><radialGradient id="cellg" cx="38%" cy="34%" r="75%"><stop offset="0" stop-color="#fff4e6"/><stop offset=".38" stop-color="#ffc58a"/><stop offset="1" stop-color="#c9703c"/></radialGradient><linearGradient id="btn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd2a0"/><stop offset="1" stop-color="#ffbd78"/></linearGradient><linearGradient id="dock" x1="0" y1="0" x2="1" y2="0.4"><stop offset="0" stop-color="#91550f"/><stop offset="1" stop-color="#2b1a2c"/></linearGradient><linearGradient id="meter" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d98a45"/><stop offset=".6" stop-color="#ffbd78"/><stop offset="1" stop-color="#ffdfb8"/></linearGradient></defs><rect x="0" y="0" width="1200" height="700" rx="14" fill="#0d0912" /><rect x="0" y="0" width="1200" height="700" rx="14" fill="url(#bgtop)" /><rect x="0" y="0" width="1200" height="700" rx="14" fill="url(#bgcorner)" /><circle cx="1169.8" cy="246.1" r="1.7" fill="#ffd9a8" fill-opacity="0.14" /><circle cx="219.5" cy="165.2" r="1" fill="#ffd9a8" fill-opacity="0.27" /><circle cx="62.6" cy="429.4" r="1" fill="#ffd9a8" fill-opacity="0.26" /><circle cx="894.8" cy="671.4" r="1.7" fill="#ffd9a8" fill-opacity="0.27" /><circle cx="114.6" cy="70.2" r="0.7" fill="#ffd9a8" fill-opacity="0.24" /><circle cx="992.9" cy="189.9" r="2.2" fill="#ffd9a8" fill-opacity="0.32" /><circle cx="434.6" cy="326.2" r="1" fill="#ffd9a8" fill-opacity="0.27" /><circle cx="815.6" cy="629.3" r="1.3" fill="#ffd9a8" fill-opacity="0.27" /><circle cx="939.5" cy="338.9" r="0.7" fill="#ffd9a8" fill-opacity="0.35" /><circle cx="573.7" cy="198.0" r="1.3" fill="#ffd9a8" fill-opacity="0.2" /><circle cx="492.9" cy="616.6" r="2.2" fill="#ffd9a8" fill-opacity="0.31" /><circle cx="1117.1" cy="294.1" r="1" fill="#ffd9a8" fill-opacity="0.15" /><circle cx="30.3" cy="226.4" r="2.2" fill="#ffd9a8" fill-opacity="0.29" /><circle cx="863.7" cy="30.8" r="1.7" fill="#ffd9a8" fill-opacity="0.25" /><circle cx="904.6" cy="612.7" r="2.2" fill="#ffd9a8" fill-opacity="0.25" /><circle cx="674.8" cy="122.8" r="2.2" fill="#ffd9a8" fill-opacity="0.31" /><circle cx="634.2" cy="293.1" r="1.3" fill="#ffd9a8" fill-opacity="0.13" /><circle cx="419.8" cy="595.2" r="2.2" fill="#ffd9a8" fill-opacity="0.32" /><circle cx="244.1" cy="55.2" r="1.7" fill="#ffd9a8" fill-opacity="0.3" /><circle cx="370.4" cy="493.4" r="0.7" fill="#ffd9a8" fill-opacity="0.3" /><circle cx="305.1" cy="544.7" r="2.2" fill="#ffd9a8" fill-opacity="0.33" /><circle cx="130.4" cy="144.4" r="1.3" fill="#ffd9a8" fill-opacity="0.31" /><circle cx="398.7" cy="42.0" r="1" fill="#ffd9a8" fill-opacity="0.14" /><circle cx="351.6" cy="359.0" r="1.3" fill="#ffd9a8" fill-opacity="0.34" /><circle cx="393.1" cy="206.4" r="2.2" fill="#ffd9a8" fill-opacity="0.2" /><circle cx="51.1" cy="637.0" r="1.7" fill="#ffd9a8" fill-opacity="0.32" /><circle cx="690.2" cy="552.2" r="1.7" fill="#ffd9a8" fill-opacity="0.13" /><circle cx="543.6" cy="649.5" r="2.2" fill="#ffd9a8" fill-opacity="0.22" /><circle cx="874.2" cy="260.8" r="2.2" fill="#ffd9a8" fill-opacity="0.14" /><circle cx="339.0" cy="508.6" r="1.7" fill="#ffd9a8" fill-opacity="0.15" /><circle cx="111.7" cy="607.5" r="1.7" fill="#ffd9a8" fill-opacity="0.18" /><circle cx="264.8" cy="470.4" r="1.7" fill="#ffd9a8" fill-opacity="0.19" /><circle cx="1054.4" cy="274.5" r="1.3" fill="#ffd9a8" fill-opacity="0.18" /><circle cx="710.0" cy="107.3" r="1.3" fill="#ffd9a8" fill-opacity="0.19" /><circle cx="481.2" cy="369.1" r="1" fill="#ffd9a8" fill-opacity="0.28" /><circle cx="1166.2" cy="425.2" r="2.2" fill="#ffd9a8" fill-opacity="0.19" /><circle cx="336.0" cy="69.0" r="0.7" fill="#ffd9a8" fill-opacity="0.24" /><circle cx="1041.7" cy="571.8" r="1" fill="#ffd9a8" fill-opacity="0.21" /><circle cx="1124.0" cy="613.9" r="2.2" fill="#ffd9a8" fill-opacity="0.13" /><circle cx="239.0" cy="594.3" r="0.7" fill="#ffd9a8" fill-opacity="0.23" /><circle cx="353.5" cy="560.0" r="1.3" fill="#ffd9a8" fill-opacity="0.3" /><circle cx="701.5" cy="626.0" r="0.7" fill="#ffd9a8" fill-opacity="0.26" /><circle cx="1106.8" cy="379.3" r="1.7" fill="#ffd9a8" fill-opacity="0.3" /><circle cx="866.6" cy="649.1" r="1.3" fill="#ffd9a8" fill-opacity="0.31" /><circle cx="447.1" cy="71.6" r="1.3" fill="#ffd9a8" fill-opacity="0.16" /><circle cx="886.0" cy="175.2" r="1.7" fill="#ffd9a8" fill-opacity="0.25" /><circle cx="579.0" cy="370.1" r="1.3" fill="#ffd9a8" fill-opacity="0.24" /><circle cx="1079.0" cy="668.7" r="0.7" fill="#ffd9a8" fill-opacity="0.3" /><circle cx="1100.5" cy="636.2" r="1.3" fill="#ffd9a8" fill-opacity="0.12" /><circle cx="90.0" cy="90.5" r="1.7" fill="#ffd9a8" fill-opacity="0.19" /><circle cx="59.4" cy="301.2" r="1.7" fill="#ffd9a8" fill-opacity="0.24" /><circle cx="1048.5" cy="507.0" r="1" fill="#ffd9a8" fill-opacity="0.25" /><circle cx="1120.1" cy="319.9" r="2.2" fill="#ffd9a8" fill-opacity="0.19" /><circle cx="187.4" cy="360.3" r="1" fill="#ffd9a8" fill-opacity="0.31" /><circle cx="843.3" cy="409.0" r="1.7" fill="#ffd9a8" fill-opacity="0.33" /><circle cx="572.0" cy="167.0" r="1.7" fill="#ffd9a8" fill-opacity="0.13" /><circle cx="513.1" cy="221.2" r="1.3" fill="#ffd9a8" fill-opacity="0.18" /><circle cx="833.0" cy="685.1" r="2.2" fill="#ffd9a8" fill-opacity="0.29" /><circle cx="971.1" cy="44.3" r="1" fill="#ffd9a8" fill-opacity="0.2" /><circle cx="280.5" cy="292.3" r="1.7" fill="#ffd9a8" fill-opacity="0.16" /><rect x="0.5" y="0.5" width="1199" height="699" rx="14" fill="none" stroke="#ffbd78" stroke-width="1" stroke-opacity="0.18" /><text x="40" y="46" class="m" font-size="10" fill="#ffbd78" letter-spacing="1.6" font-weight="500" xml:space="preserve" >THE CHECK</text><text x="40" y="86" class="s" font-size="32" fill="#f6ece6" letter-spacing="-0.5">What happens when you tap <tspan class="si" fill="#ffbd78">Run code.</tspan></text><line x1="40" y1="108" x2="1160" y2="108" stroke="#ffbd78" stroke-opacity="0.14" stroke-width="1" stroke-linecap="round"/><rect x="40" y="132" width="250" height="130" rx="16" fill="#1c1322" stroke="#ffbd78" stroke-width="1" stroke-opacity="0.16" /><circle cx="66" cy="160" r="12" fill="none" stroke="#ffbd78" stroke-width="1.2" stroke-opacity="0.55" /><text x="66" y="164" class="m" font-size="10.5" fill="#ffbd78" text-anchor="middle" font-weight="500" xml:space="preserve" >1</text><text x="88" y="164" class="m" font-size="12.5" fill="#f6ece6" font-weight="500" xml:space="preserve" >Open a level</text><text x="58" y="194" class="b" font-size="11.2" fill="#bba9ae" xml:space="preserve" >PlayScreen shows the prompt, the</text><text x="58" y="210" class="b" font-size="11.2" fill="#bba9ae" xml:space="preserve" >starter CSS and a live preview of</text><text x="58" y="226" class="b" font-size="11.2" fill="#bba9ae" xml:space="preserve" >the scene while you read.</text><rect x="330" y="132" width="250" height="130" rx="16" fill="#1c1322" stroke="#ffbd78" stroke-width="1" stroke-opacity="0.16" /><circle cx="356" cy="160" r="12" fill="none" stroke="#ffbd78" stroke-width="1.2" stroke-opacity="0.55" /><text x="356" y="164" class="m" font-size="10.5" fill="#ffbd78" text-anchor="middle" font-weight="500" xml:space="preserve" >2</text><text x="378" y="164" class="m" font-size="12.5" fill="#f6ece6" font-weight="500" xml:space="preserve" >Tap Run code</text><text x="348" y="194" class="b" font-size="11.2" fill="#bba9ae" xml:space="preserve" >checkCss(html, userCss, targetCss)</text><text x="348" y="210" class="b" font-size="11.2" fill="#bba9ae" xml:space="preserve" >renders both into hidden frames.</text><text x="348" y="226" class="b" font-size="11.2" fill="#bba9ae" xml:space="preserve" >A 6 s load timer is armed.</text><rect x="620" y="132" width="250" height="130" rx="16" fill="#1c1322" stroke="#ffbd78" stroke-width="1" stroke-opacity="0.16" /><circle cx="646" cy="160" r="12" fill="none" stroke="#ffbd78" stroke-width="1.2" stroke-opacity="0.55" /><text x="646" y="164" class="m" font-size="10.5" fill="#ffbd78" text-anchor="middle" font-weight="500" xml:space="preserve" >3</text><text x="668" y="164" class="m" font-size="12.5" fill="#f6ece6" font-weight="500" xml:space="preserve" >Frames load</text><text x="638" y="194" class="b" font-size="11.2" fill="#bba9ae" xml:space="preserve" >Script-free iframes, three contexts:</text><text x="638" y="210" class="b" font-size="11.2" fill="#bba9ae" xml:space="preserve" >360 px, 900 px and hover and</text><text x="638" y="226" class="b" font-size="11.2" fill="#bba9ae" xml:space="preserve" >focus held on.</text><rect x="910" y="132" width="250" height="130" rx="16" fill="#1c1322" stroke="#ffbd78" stroke-width="1" stroke-opacity="0.16" /><circle cx="936" cy="160" r="12" fill="none" stroke="#ffbd78" stroke-width="1.2" stroke-opacity="0.55" /><text x="936" y="164" class="m" font-size="10.5" fill="#ffbd78" text-anchor="middle" font-weight="500" xml:space="preserve" >4</text><text x="958" y="164" class="m" font-size="12.5" fill="#f6ece6" font-weight="500" xml:space="preserve" >Render yours</text><text x="928" y="194" class="b" font-size="11.2" fill="#bba9ae" xml:space="preserve" >Your CSS is applied over the scene</text><text x="928" y="210" class="b" font-size="11.2" fill="#bba9ae" xml:space="preserve" >base. Animations rest on their</text><text x="928" y="226" class="b" font-size="11.2" fill="#bba9ae" xml:space="preserve" >first frame.</text><rect x="40" y="304" width="250" height="130" rx="16" fill="#1c1322" stroke="#ffbd78" stroke-width="1" stroke-opacity="0.16" /><circle cx="66" cy="332" r="12" fill="none" stroke="#ffbd78" stroke-width="1.2" stroke-opacity="0.55" /><text x="66" y="336" class="m" font-size="10.5" fill="#ffbd78" text-anchor="middle" font-weight="500" xml:space="preserve" >5</text><text x="88" y="336" class="m" font-size="12.5" fill="#f6ece6" font-weight="500" xml:space="preserve" >Render the key</text><text x="58" y="366" class="b" font-size="11.2" fill="#bba9ae" xml:space="preserve" >The answer key renders the same</text><text x="58" y="382" class="b" font-size="11.2" fill="#bba9ae" xml:space="preserve" >way, in its own frame.</text><rect x="330" y="304" width="250" height="130" rx="16" fill="#1c1322" stroke="#ffbd78" stroke-width="1" stroke-opacity="0.3" /><rect x="330" y="304" width="250" height="130" rx="16" fill="#ffbd78" fill-opacity="0.06" /><circle cx="356" cy="332" r="12" fill="none" stroke="#ffbd78" stroke-width="1.2" stroke-opacity="0.55" /><text x="356" y="336" class="m" font-size="10.5" fill="#ffbd78" text-anchor="middle" font-weight="500" xml:space="preserve" >6</text><text x="378" y="336" class="m" font-size="12.5" fill="#f6ece6" font-weight="500" xml:space="preserve" >Compare</text><text x="348" y="366" class="b" font-size="11.2" fill="#bba9ae" xml:space="preserve" >Every element computed style, plus</text><text x="348" y="382" class="b" font-size="11.2" fill="#bba9ae" xml:space="preserve" >pseudo-elements and keyframes.</text><rect x="620" y="304" width="250" height="130" rx="16" fill="#1c1322" stroke="#ffbd78" stroke-width="1" stroke-opacity="0.16" /><circle cx="646" cy="332" r="12" fill="none" stroke="#ffbd78" stroke-width="1.2" stroke-opacity="0.55" /><text x="646" y="336" class="m" font-size="10.5" fill="#ffbd78" text-anchor="middle" font-weight="500" xml:space="preserve" >7</text><text x="668" y="336" class="m" font-size="12.5" fill="#f6ece6" font-weight="500" xml:space="preserve" >Verdict</text><text x="638" y="366" class="b" font-size="11.2" fill="#bba9ae" xml:space="preserve" >MATCHED lights the star. NO MATCH</text><text x="638" y="382" class="b" font-size="11.2" fill="#bba9ae" xml:space="preserve" >names the elements and properties</text><text x="638" y="398" class="b" font-size="11.2" fill="#bba9ae" xml:space="preserve" >that still differ.</text><rect x="910" y="304" width="250" height="130" rx="16" fill="#1c1322" stroke="#ffbd78" stroke-width="1" stroke-opacity="0.3" /><rect x="910" y="304" width="250" height="130" rx="16" fill="#ffbd78" fill-opacity="0.06" /><circle cx="936" cy="332" r="12" fill="none" stroke="#ffbd78" stroke-width="1.2" stroke-opacity="0.55" /><text x="936" y="336" class="m" font-size="10.5" fill="#ffbd78" text-anchor="middle" font-weight="500" xml:space="preserve" >8</text><text x="958" y="336" class="m" font-size="12.5" fill="#f6ece6" font-weight="500" xml:space="preserve" >Save progress</text><text x="928" y="366" class="b" font-size="11.2" fill="#bba9ae" xml:space="preserve" >A first solve calls applySolve:</text><text x="928" y="382" class="b" font-size="11.2" fill="#bba9ae" xml:space="preserve" >starlight, streak and the solved list</text><text x="928" y="398" class="b" font-size="11.2" fill="#bba9ae" xml:space="preserve" >go to localStorage.</text><path d="M290 197 L330 197" fill="none" stroke="#ffbd78" stroke-opacity="1" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar)"/><path d="M580 197 L620 197" fill="none" stroke="#ffbd78" stroke-opacity="1" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar)"/><path d="M870 197 L910 197" fill="none" stroke="#ffbd78" stroke-opacity="1" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar)"/><path d="M290 369 L330 369" fill="none" stroke="#ffbd78" stroke-opacity="1" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar)"/><path d="M580 369 L620 369" fill="none" stroke="#ffbd78" stroke-opacity="1" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar)"/><path d="M870 369 L910 369" fill="none" stroke="#ffbd78" stroke-opacity="1" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar)"/><path d="M1035 262 L1035 284 L165 284 L165 300" fill="none" stroke="#ffbd78" stroke-width="1.4" stroke-opacity="1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)" /><text x="40" y="482" class="m" font-size="9.5" fill="#ffbd78" letter-spacing="1.52" font-weight="500" xml:space="preserve" >WHEN IT DOES NOT GO TO PLAN</text><rect x="40" y="498" width="265" height="150" rx="16" fill="#1c1322" stroke="#ff8fa3" stroke-width="1" stroke-opacity="0.3" /><rect x="40" y="498" width="265" height="150" rx="16" fill="#ff8fa3" fill-opacity="0.06" /><text x="56" y="523" class="m" font-size="8.5" fill="#ff8fa3" letter-spacing="1.36" font-weight="500" xml:space="preserve" >CSS NOTES</text><g transform="translate(271 510) scale(0.7500)" fill="none" stroke="#ff8fa3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" x2="20" y1="19" y2="19"/></g><text x="56" y="547" class="m" font-size="12.5" fill="#f6ece6" font-weight="500" xml:space="preserve" >Lint before the run</text><text x="56" y="567" class="b" font-size="11" fill="#bba9ae" xml:space="preserve" >Typos the browser silently ignores</text><text x="56" y="582" class="b" font-size="11" fill="#bba9ae" xml:space="preserve" >are flagged by line. Fix them,</text><text x="56" y="597" class="b" font-size="11" fill="#bba9ae" xml:space="preserve" >then run again.</text><rect x="325" y="498" width="265" height="150" rx="16" fill="#1c1322" stroke="#ffe3a1" stroke-width="1" stroke-opacity="0.3" /><rect x="325" y="498" width="265" height="150" rx="16" fill="#ffe3a1" fill-opacity="0.06" /><text x="341" y="523" class="m" font-size="8.5" fill="#ffe3a1" letter-spacing="1.36" font-weight="500" xml:space="preserve" >STATES</text><g transform="translate(556 510) scale(0.7500)" fill="none" stroke="#ffe3a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></g><text x="341" y="547" class="m" font-size="12.5" fill="#f6ece6" font-weight="500" xml:space="preserve" >Hover and focus</text><text x="341" y="567" class="b" font-size="11" fill="#bba9ae" xml:space="preserve" >:hover, :focus and :active are held</text><text x="341" y="582" class="b" font-size="11" fill="#bba9ae" xml:space="preserve" >on in a third pass, so a rule with</text><text x="341" y="597" class="b" font-size="11" fill="#bba9ae" xml:space="preserve" >no visible state is not enough.</text><rect x="610" y="498" width="265" height="150" rx="16" fill="#1c1322" stroke="#9fe8ff" stroke-width="1" stroke-opacity="0.3" /><rect x="610" y="498" width="265" height="150" rx="16" fill="#9fe8ff" fill-opacity="0.06" /><text x="626" y="523" class="m" font-size="8.5" fill="#9fe8ff" letter-spacing="1.36" font-weight="500" xml:space="preserve" >SLOW FRAME</text><g transform="translate(841 510) scale(0.7500)" fill="none" stroke="#9fe8ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></g><text x="626" y="547" class="m" font-size="12.5" fill="#f6ece6" font-weight="500" xml:space="preserve" >6 s load limit</text><text x="626" y="567" class="b" font-size="11" fill="#bba9ae" xml:space="preserve" >If a frame cannot load in time, a</text><text x="626" y="582" class="b" font-size="11" fill="#bba9ae" xml:space="preserve" >message asks you to tap Run</text><text x="626" y="597" class="b" font-size="11" fill="#bba9ae" xml:space="preserve" >again. The page never freezes.</text><rect x="895" y="498" width="265" height="150" rx="16" fill="#1c1322" stroke="#86efb8" stroke-width="1" stroke-opacity="0.3" /><rect x="895" y="498" width="265" height="150" rx="16" fill="#86efb8" fill-opacity="0.06" /><text x="911" y="523" class="m" font-size="8.5" fill="#86efb8" letter-spacing="1.36" font-weight="500" xml:space="preserve" >EXAMPLE · LEVEL 12</text><text x="911" y="556" class="m" font-size="10.5" fill="#8f7d86" xml:space="preserve" >yours</text><text x="981" y="556" class="m" font-size="10.5" fill="#f6ece6" xml:space="preserve" >"padding: 12px 28px"</text><text x="911" y="582" class="m" font-size="10.5" fill="#8f7d86" xml:space="preserve" >key</text><text x="981" y="582" class="m" font-size="10.5" fill="#f6ece6" xml:space="preserve" >"padding: 12px 28px"</text><text x="911" y="608" class="m" font-size="10.5" fill="#8f7d86" xml:space="preserve" >same</text><text x="981" y="608" class="m" font-size="10.5" fill="#86efb8" xml:space="preserve" >true</text><text x="600.0" y="678" class="m" font-size="9.5" fill="#8f7d86" text-anchor="middle" letter-spacing="0.6" xml:space="preserve" >The check compares what the browser draws, so any CSS that renders the same is accepted.</text></svg>
