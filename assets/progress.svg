="14" fill="#140d19" stroke="#ffbd78" stroke-width="1" stroke-opacity="0.18" /><circle cx="684" cy="264" r="4.5" fill="#8fb4ff" /><circle cx="684" cy="264" r="9" fill="#8fb4ff" fill-opacity="0.14" /><text x="704" y="260" class="m" font-size="9.5" fill="#8fb4ff" letter-spacing="1.3" font-weight="500" xml:space="preserve" >SAME DAY</text><text x="704" y="278" class="b" font-size="11" fill="#bba9ae" xml:space="preserve" >Solved again on the same day</text><text x="1120" y="269" class="m" font-size="12" fill="#f6ece6" text-anchor="end" font-weight="500" xml:space="preserve" >unchanged</text><rect x="664" y="300" width="472" height="52" rx="14" fill="#140d19" stroke="#ffbd78" stroke-width="1" stroke-opacity="0.18" /><circle cx="684" cy="326" r="4.5" fill="#ff8fa3" /><circle cx="684" cy="326" r="9" fill="#ff8fa3" fill-opacity="0.14" /><text x="704" y="322" class="m" font-size="9.5" fill="#ff8fa3" letter-spacing="1.3" font-weight="500" xml:space="preserve" >GAP OR FIRST</text><text x="704" y="340" class="b" font-size="11" fill="#bba9ae" xml:space="preserve" >Anything longer, or your first solve</text><text x="1120" y="331" class="m" font-size="12" fill="#f6ece6" text-anchor="end" font-weight="500" xml:space="preserve" >resets to 1</text><g transform="translate(664 372) scale(0.6667)" fill="none" stroke="#ffe3a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></g><text x="688" y="385" class="b" font-size="10.8" fill="#bba9ae" xml:space="preserve" >The header shows 0 once you miss a whole day. The streak is only alive</text><text x="688" y="401" class="b" font-size="10.8" fill="#bba9ae" xml:space="preserve" >if you last solved today or yesterday, on your local calendar.</text><text x="664" y="426" class="b" font-size="10.8" fill="#7a6670" xml:space="preserve" >Re-solving a finished level awards nothing.</text></svg>
